<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Algo Bot Web{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="shortcut icon" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="shell">
        <header class="topbar">
            <div class="brand-block">
                <a class="brand" href="/">
                    <span class="brand-mark">A</span>
                    <span class="brand-copy">
                        <strong>Algo Bot Web</strong>
                        <small>Персональный помощник</small>
                    </span>
                </a>
            </div>
            {% if user %}
            <form class="userbar" method="post" action="/logout">
                <div class="userchip">
                    <span class="userchip-role">{{ user.role }}</span>
                    <span class="userchip-name">{{ user.display_name if user.display_name else user.username }}</span>
                </div>
                <button type="submit" class="ghost-button">Выйти</button>
            </form>
            {% endif %}
        </header>

        <nav class="navpanel">
            <a class="{% if request.url.path == '/' %}active{% endif %}" href="/">Главная</a>
            <a class="{% if request.url.path.startswith('/courses') %}active{% endif %}" href="/courses">Курсы</a>
            <a class="{% if request.url.path.startswith('/groups') %}active{% endif %}" href="/groups">Группы</a>
            <a class="{% if request.url.path.startswith('/hub') %}active{% endif %}" href="/hub">Хаб</a>
            {% if user and user.role == 'admin' %}
            <a class="{% if request.url.path.startswith('/access') %}active{% endif %}" href="/access">Доступы</a>
            <a class="{% if request.url.path.startswith('/system') %}active{% endif %}" href="/system/logs">Система</a>
            {% endif %}
        </nav>

        <main class="page">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script>
        async function copyTextToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
                return;
            }

            const helper = document.createElement("textarea");
            helper.value = text;
            helper.setAttribute("readonly", "");
            helper.style.position = "absolute";
            helper.style.left = "-9999px";
            document.body.appendChild(helper);
            helper.select();
            document.execCommand("copy");
            document.body.removeChild(helper);
        }

        document.addEventListener("click", async (event) => {
            const button = event.target.closest("[data-copy-target]");
            if (!button) {
                return;
            }

            const targetId = button.dataset.copyTarget;
            const target = document.getElementById(targetId);
            if (!target) {
                return;
            }

            const defaultLabel = button.dataset.copyLabel || button.textContent.trim();
            const successLabel = button.dataset.copySuccess || "Скопировано";
            const errorLabel = button.dataset.copyError || "Не удалось";

            try {
                await copyTextToClipboard(target.innerText.trim());
                button.textContent = successLabel;
                button.classList.add("copy-button-success");
            } catch (error) {
                button.textContent = errorLabel;
                button.classList.add("copy-button-error");
            }

            window.setTimeout(() => {
                button.textContent = defaultLabel;
                button.classList.remove("copy-button-success", "copy-button-error");
            }, 1800);
        });
    </script>
</body>

</html>
